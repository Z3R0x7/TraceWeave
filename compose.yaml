services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      IMPORT_ROOT: /data/input
      DATA_ROOT: /data/app
      APPROVED_REMOTE_HOSTS: ${APPROVED_REMOTE_HOSTS:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
    volumes:
      - ./data/input:/data/input:ro
      - app-data:/data/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 2g
  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
volumes:
  app-data:
