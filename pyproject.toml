[project]
name = "attack-investigation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "httpx>=0.27", "duckdb>=1.1", "streamlit>=1.40", "plotly>=5.24", "pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pyright>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["api", "ui", "scripts", "tests"]
typeCheckingMode = "basic"
