<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="170" viewBox="0 0 1100 170" role="img" aria-labelledby="title"><title id="title">TraceWeave investigation pipeline</title><rect width="100%" height="100%" rx="12" fill="#101827"/><text x="20" y="30" fill="#e5edf7" font-family="sans-serif" font-size="20">TraceWeave investigation pipeline</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58e0c1"/></marker></defs><rect x="20" y="60" width="160" height="78" rx="8" fill="#1e293b" stroke="#58e0c1"/><text x="100" y="86" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Raw logs</text><text x="100" y="106" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Local file or SSH</text><path d="M180 99H197" stroke="#58e0c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="60" width="160" height="78" rx="8" fill="#1e293b" stroke="#58e0c1"/><text x="280" y="86" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Streaming engine</text><text x="280" y="106" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Parse and normalize</text><path d="M360 99H377" stroke="#58e0c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="60" width="160" height="78" rx="8" fill="#1e293b" stroke="#58e0c1"/><text x="460" y="86" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Detection</text><text x="460" y="106" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Rules and correlation</text><path d="M540 99H557" stroke="#58e0c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="60" width="160" height="78" rx="8" fill="#1e293b" stroke="#58e0c1"/><text x="640" y="86" fill="#e5edf7" font-family="sans-serif" font-size="13" text-anchor="middle">Bounded AI pool</text><text x="640" y="106" fill="#e5edf7" font-family="sans-s